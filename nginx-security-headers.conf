# Shared security headers.
#
# This file exists because of an nginx rule that is easy to get wrong:
# `add_header` directives are inherited from an outer block ONLY IF the inner
# block declares none of its own. The previous config set these headers at
# `server` level and then used `add_header Cache-Control ...` inside the static
# asset and index.html locations — which silently discarded every security
# header on those responses. Since those two locations plus the SPA fallback
# cover every request, the headers were being served on nothing at all.
#
# `include`-ing this file in each location keeps them applied everywhere.
# `always` makes them apply to error responses (404/50x) too.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Enable once the deployment is confirmed to be HTTPS-only; it is ignored over
# plain HTTP, but a wrong max-age on a shared hostname is painful to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy.
#   'wasm-unsafe-eval' — three.js loaders compile WebAssembly.
#   'unsafe-inline' (script) — the inline theme bootstrap in index.html, which
#       must run before first paint to avoid a flash of the wrong theme.
#   'unsafe-inline' (style) — Tailwind and react-three inject styles at runtime.
#   blob: worker/child — three.js and drei create workers from blobs.
#   connect-src live-labs.org — the central lab authorization check.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://live-labs.org; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# X-XSS-Protection is deliberately omitted. It is deprecated, removed from
# modern browsers, and its legacy filter introduced vulnerabilities of its own;
# CSP above is the actual control.
