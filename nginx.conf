server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in responses.
    server_tokens off;

    # Reject absurd request bodies outright; this app uploads nothing.
    client_max_body_size 1m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Container/orchestrator health probe. Kept above the SPA fallback so it
    # returns 200 rather than the HTML shell.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Source maps are built (`sourcemap: 'hidden'`) so a production stack trace
    # can be read, but they must not be served. 'hidden' only omits the
    # `//# sourceMappingURL=` comment — it does not stop anyone requesting
    # `/assets/index-<hash>.js.map` directly, and that file contains the
    # complete original TypeScript. They belong to whoever holds the build
    # artifact, not to whoever holds the URL.
    location ~* \.map$ {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        return 404;
    }

    # The service worker must never be cached, otherwise a client keeps running
    # the old worker forever and never picks up a fix to the caching strategy —
    # exactly the failure this project already hit once. It matched the generic
    # `\.js$` rule below and was being cached for a year.
    location = /service-worker.js {
        include /etc/nginx/conf.d/security-headers.conf;
        # `add_header` only — pairing it with `expires` emits Cache-Control twice.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # Optional: same-origin proxy for the 6G Network Copilot gateway.
    #
    # Uncomment and point `proxy_pass` at your gateway, then build with
    # VITE_LLM_PROXY_URL=/llm. Routing the gateway through this origin means
    # the Content-Security-Policy's `'self'` already permits it — no CSP edit —
    # and the hub's session cookie stays first-party, which is what the client's
    # `credentials: 'include'` requires.
    #
    # location /llm/ {
    #     include /etc/nginx/conf.d/security-headers.conf;
    #     proxy_pass https://gateway.example.org/;
    #     proxy_set_header Host $proxy_host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # Model responses are slow; the default 60s read timeout cuts them off.
    #     proxy_read_timeout 120s;
    # }
    # ------------------------------------------------------------------------

    # Content-hashed build output: the filename changes whenever the bytes do,
    # so it is safe to cache immutably.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Un-hashed static files (icons, manifest, favicon): revalidate daily.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|json|webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html names the hashed bundles, so caching it strands clients on
    # asset URLs that no longer exist after a deploy.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles that slip into the image.
    location ~ /\. {
        deny all;
        access_log off;
    }
}
